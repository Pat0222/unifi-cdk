# Fluent Bit on the UniFi controller (EC2): ships server.log to S3.
# Installed by setup.sh. LOG_BUCKET, AWS_REGION, UNIFI_HOST and
# UNIFI_HOSTNAME come from the systemd drop-in that setup.sh writes.

[SERVICE]
    flush                     5
    grace                     30
    log_level                 info
    parsers_file              /etc/fluent-bit/unifi-parsers.conf
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.backlog.mem_limit 5M

[INPUT]
    name              tail
    tag               controller
    path              /opt/unifi/config/logs/server.log
    db                /var/lib/fluent-bit/tail.db
    read_from_head    true
    refresh_interval  10
    rotate_wait       30
    multiline.parser  unifi_server_log
    buffer_max_size   1M
    skip_long_lines   on
    storage.type      filesystem

[FILTER]
    name    lua
    match   controller
    script  /etc/fluent-bit/unifi.lua
    call    controller_record

# Uploads when a file reaches total_file_size or has been open for
# upload_timeout, whichever comes first, so at least hourly.
[OUTPUT]
    name                 s3
    match                controller
    bucket               ${LOG_BUCKET}
    region               ${AWS_REGION}
    use_put_object       on
    compression          gzip
    total_file_size      20M
    upload_timeout       60m
    s3_key_format        /unifi/controller/year=%Y/month=%m/day=%d/%H%M%S-$UUID.json.gz
    store_dir            /var/lib/fluent-bit/s3
    store_dir_limit_size 256M
    json_date_key        false
    retry_limit          10000
