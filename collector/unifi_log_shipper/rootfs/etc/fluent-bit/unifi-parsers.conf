# Parsers shared by the controller (EC2) and the Home Assistant add-on.
# The EC2 copy is packaged from this file by lib/constructs/ec2.ts.

# server.log entries start with "[2026-11-02T14:12:05,706-05:00] ". Lines
# that don't (Java stack traces) belong to the entry above them.
[MULTILINE_PARSER]
    name          unifi_server_log
    type          regex
    flush_timeout 2000
    rule          "start_state"  "/^\[\d{4}-\d{2}-\d{2}T[^\]]+\] /"  "cont"
    rule          "cont"         "/^(?!\[\d{4}-\d{2}-\d{2}T)/"        "cont"

# Lenient RFC 3164 syslog. Every part after <PRI> is optional and the rest
# of the line always lands in "message", so no line is dropped for not
# matching. The original line is also kept in "raw" (raw_message_key).
# As in RFC 3164, a hostname is only read right after a timestamp.
# RFC 5424 lines ("<PRI>1 ...") are re-parsed in unifi.lua.
# No time_key: record time is the time the Pi received the line, because
# RFC 3164 timestamps have no year or time zone.
[PARSER]
    name    unifi_syslog
    format  regex
    regex   ^(?:<(?<pri>\d{1,3})>)?\s*(?:(?<syslog_time>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?:(?<hostname>[^\s:]+)\s+)?)?(?:(?<program>[^\s:\[]+)(?:\[(?<pid>\d+)\])?:\s*)?(?<message>[\s\S]*)$
