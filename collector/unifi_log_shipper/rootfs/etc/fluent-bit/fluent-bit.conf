# Fluent Bit in the Home Assistant add-on: receives UniFi syslog and ships
# it to S3. S3_BUCKET, S3_REGION, SYSLOG_PORT and the AWS keys come from the
# add-on options (see /run.sh).

[SERVICE]
    flush                     5
    grace                     30
    log_level                 info
    parsers_file              /etc/fluent-bit/unifi-parsers.conf
    # Received lines are written to disk before upload (SD card friendly limits below).
    storage.path              /data/flb-storage
    storage.sync              normal
    storage.backlog.mem_limit 5M
    storage.max_chunks_up     16
    # Used only by the add-on watchdog.
    http_server               on
    http_listen               0.0.0.0
    http_port                 2020

[INPUT]
    name               syslog
    tag                devices
    mode               udp
    listen             0.0.0.0
    port               ${SYSLOG_PORT}
    parser             unifi_syslog
    source_address_key host
    raw_message_key    raw
    buffer_chunk_size  32KB
    buffer_max_size    64KB
    storage.type       filesystem

[FILTER]
    name    lua
    match   devices
    script  /etc/fluent-bit/unifi.lua
    call    device_record

# Uploads when a file reaches total_file_size or has been open for
# upload_timeout, whichever comes first, so at least hourly. While the
# internet is down, files wait in store_dir (capped at 64 MB; past that, new
# lines are dropped) and upload once it's back.
[OUTPUT]
    name                      s3
    match                     devices
    bucket                    ${S3_BUCKET}
    region                    ${S3_REGION}
    use_put_object            on
    compression               gzip
    total_file_size           10M
    upload_timeout            60m
    s3_key_format             /unifi/devices/year=%Y/month=%m/day=%d/%H%M%S-$UUID.json.gz
    store_dir                 /data/s3-buffer
    store_dir_limit_size      64M
    quarantine_dir_limit_size 16M
    json_date_key             false
    retry_limit               10000
