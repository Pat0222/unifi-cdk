name: UniFi Log Shipper
version: "1.1.0"
slug: unifi_log_shipper
description: Receives syslog from UniFi devices and archives it in S3, buffering to disk while the internet is down.
url: https://github.com/Pat0222/unifi-cdk
arch:
  - aarch64
  - amd64
# The Pi's certificate and key live in Home Assistant's /ssl folder.
map:
  - ssl
startup: application
boot: auto
init: false
# host_network so UDP syslog from the LAN reaches the add-on directly.
host_network: true
# Checks that Fluent Bit is running. It deliberately doesn't use the health
# endpoint, which reports failed uploads and would restart the add-on during
# every internet outage.
watchdog: "http://[HOST]:[PORT:2020]/api/v1/uptime"
options:
  bucket: ""
  region: us-east-1
  trust_anchor_arn: ""
  profile_arn: ""
  role_arn: ""
  certificate: unifi-log-shipper.crt
  private_key: unifi-log-shipper.key
  syslog_port: 5514
schema:
  bucket: str
  region: str
  trust_anchor_arn: str
  profile_arn: str
  role_arn: str
  certificate: str
  private_key: str
  syslog_port: port
